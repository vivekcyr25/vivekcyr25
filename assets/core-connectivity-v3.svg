<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 100" width="900" height="100">
<defs>
  <linearGradient id="panelbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="100%" stop-color="#050d18"/>
  </linearGradient>
  <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="900" height="100" fill="url(#panelbg)" rx="6"/>


<a href="https://www.linkedin.com/in/vivek-sharma-2bba8b398/" target="_blank">
  <!-- Card bg -->
  <rect x="8" y="4" width="118" height="92" rx="8" fill="#040e1c" opacity="0.95"/>

  <!-- Animated border -->
  <rect x="8" y="4" width="118" height="92" rx="8" fill="none"
        stroke="#0A66C2" stroke-width="1.4">
    <animate attributeName="stroke-opacity" values="0.25;0.9;0.25"
             dur="3.0s" repeatCount="indefinite" begin="0.0s"/>
  </rect>

  <!-- Top accent bar -->
  <rect x="8" y="4" width="0" height="2.5" rx="1" fill="#0A66C2" opacity="0.7">
    <animate attributeName="width" from="0" to="118"
             dur="1s" fill="freeze" begin="0.1s"
             calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Real logo image -->
  <image x="50.0" y="16" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>

  <!-- Platform name -->
  <text x="67.0" y="75"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="11" font-weight="600"
        fill="#4da8ff" text-anchor="middle" letter-spacing="0.4">LinkedIn</text>

  <!-- Glow layer -->
  <rect x="8" y="4" width="118" height="92" rx="8" fill="none"
        stroke="#0A66C2" stroke-width="8" filter="url(#gl)" opacity="0">
    <animate attributeName="opacity" values="0;0.08;0"
             dur="3.0s" repeatCount="indefinite" begin="0.0s"/>
  </rect>
</a>


