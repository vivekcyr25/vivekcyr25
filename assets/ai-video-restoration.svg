<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040a16" />
      <stop offset="40%" stop-color="#050c1e" />
      <stop offset="80%" stop-color="#090620" />
      <stop offset="100%" stop-color="#0d0828" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradient for Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#BC13FE" />
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09132b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050a18" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="waveGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="waveGradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BC13FE" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- 1. MAIN BACKGROUND -->
  <rect width="900" height="450" fill="url(#bgGrad)" rx="12" />

  <!-- 2. TECH GRID PATTERN -->
  <g stroke="#00F2FF" stroke-width="0.5" opacity="0.08">
    <line x1="45" y1="0" x2="45" y2="450" />
    <line x1="135" y1="0" x2="135" y2="450" />
    <line x1="225" y1="0" x2="225" y2="450" />
    <line x1="315" y1="0" x2="315" y2="450" />
    <line x1="405" y1="0" x2="405" y2="450" />
    <line x1="495" y1="0" x2="495" y2="450" />
    <line x1="585" y1="0" x2="585" y2="450" />
    <line x1="675" y1="0" x2="675" y2="450" />
    <line x1="765" y1="0" x2="765" y2="450" />
    <line x1="855" y1="0" x2="855" y2="450" />
    <line x1="0" y1="45" x2="900" y2="45" />
    <line x1="0" y1="135" x2="900" y2="135" />
    <line x1="0" y1="225" x2="900" y2="225" />
    <line x1="0" y1="315" x2="900" y2="315" />
    <line x1="0" y1="405" x2="900" y2="405" />
  </g>

  <!-- Outer Glass Frame -->
  <rect x="14" y="14" width="872" height="422" rx="10" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.85" filter="url(#cyanGlow)" />

  <!-- Corner Tech Brackets -->
  <path d="M 14 34 L 14 14 L 34 14" fill="none" stroke="#00F2FF" stroke-width="3" />
  <path d="M 886 34 L 886 14 L 866 14" fill="none" stroke="#00F2FF" stroke-width="3" />
  <path d="M 14 416 L 14 436 L 34 436" fill="none" stroke="#BC13FE" stroke-width="3" />
  <path d="M 886 416 L 886 436 L 866 436" fill="none" stroke="#BC13FE" stroke-width="3" />

  <!-- 3. HEADER BADGE & STATUS -->
  <g transform="translate(45, 45)">
    <!-- Status Dot -->
    <circle cx="6" cy="6" r="4.5" fill="#00FF88" filter="url(#greenGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#00FF88" letter-spacing="1.5">SYSTEM_ONLINE // PIPELINE_ACTIVE</text>

    <!-- Tag Pill Right -->
    <rect x="670" y="-8" width="140" height="26" rx="13" fill="#071329" stroke="#00F2FF" stroke-width="1" opacity="0.9" />
    <text x="740" y="9" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" fill="#00F2FF" text-anchor="middle" letter-spacing="1">AI ENGINE v2.4</text>
  </g>

  <!-- Decorative Separator Line -->
  <line x1="45" y1="72" x2="855" y2="72" stroke="#102548" stroke-width="1.2" />

  <!-- 4. TITLE & SUBTITLE SECTION WITH LIVE METRIC MINI-GRAPHS -->
  <g transform="translate(45, 120)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
      AI VIDEO RESTORATION
    </text>

    <!-- Highlight Tag -->
    <text x="0" y="32" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="url(#accentGrad)" letter-spacing="2.5" filter="url(#cyanGlow)">
      PIPELINE ARCHITECTURE
    </text>

    <text x="0" y="60" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#8FA0C5" letter-spacing="0.5">
      Automated Frame Enhancement · Noise Reduction · Super-Resolution
    </text>

    <!-- LIVE PSNR / QUALITY METRIC GRAPH (TOP RIGHT CORNER OF TITLE AREA) -->
    <g transform="translate(560, -25)">
      <rect x="0" y="0" width="250" height="85" rx="8" fill="url(#glassCard)" stroke="#12284c" stroke-width="1" />
      <text x="14" y="18" font-family="'Courier New', monospace" font-size="8.5" fill="#00F2FF" font-weight="bold">FRAME QUALITY (PSNR / SSIM)</text>
      
      <!-- Live Quality Waveform Line 1 (Cyan PSNR) -->
      <path d="M 14 60 L 50 48 L 85 55 L 120 32 L 155 42 L 190 25 L 235 30" fill="none" stroke="#00F2FF" stroke-width="1.8" filter="url(#cyanGlow)">
        <animate attributeName="d" 
          values="M 14 60 L 50 48 L 85 55 L 120 32 L 155 42 L 190 25 L 235 30;
                  M 14 55 L 50 42 L 85 60 L 120 28 L 155 48 L 190 20 L 235 35;
                  M 14 60 L 50 48 L 85 55 L 120 32 L 155 42 L 190 25 L 235 30"
          dur="4s" repeatCount="indefinite" />
      </path>

      <!-- Live Quality Waveform Line 2 (Purple SSIM) -->
      <path d="M 14 68 L 50 58 L 85 64 L 120 45 L 155 52 L 190 38 L 235 42" fill="none" stroke="#BC13FE" stroke-width="1.5" opacity="0.85" filter="url(#purpleGlow)">
        <animate attributeName="d" 
          values="M 14 68 L 50 58 L 85 64 L 120 45 L 155 52 L 190 38 L 235 42;
                  M 14 62 L 50 64 L 85 58 L 120 40 L 155 58 L 190 32 L 235 45;
                  M 14 68 L 50 58 L 85 64 L 120 45 L 155 52 L 190 38 L 235 42"
          dur="3.5s" repeatCount="indefinite" />
      </path>

      <!-- Traveling Data Node Dot -->
      <circle cx="190" cy="25" r="3.5" fill="#00FF88" filter="url(#greenGlow)">
        <animate attributeName="cy" values="25;20;25" dur="4s" repeatCount="indefinite" />
      </circle>
      
      <text x="14" y="78" font-family="'Courier New', monospace" font-size="7.5" fill="#00FF88">+14.8 dB RECOVERY</text>
      <text x="235" y="78" font-family="'Courier New', monospace" font-size="7.5" fill="#BC13FE" text-anchor="end">0.982 SSIM</text>
    </g>
  </g>

  <!-- 5. VISUAL PIPELINE FLOW DIAGRAM -->
  <!-- Glass Card Box for Diagram -->
  <rect x="45" y="215" width="810" height="140" rx="10" fill="url(#glassCard)" stroke="#162a52" stroke-width="1.2" />

  <!-- Laser Scanline Animation running vertically across diagram -->
  <line x1="50" y1="215" x2="850" y2="215" stroke="#00F2FF" stroke-width="1" opacity="0.4" filter="url(#cyanGlow)">
    <animate attributeName="y1" values="215;355;215" dur="5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="215;355;215" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite" />
  </line>

  <!-- Pipeline Stage 1: Input Video Frame -->
  <g transform="translate(70, 235)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#081024" stroke="#00F2FF" stroke-width="1.2" opacity="0.95" />
    <text x="75" y="25" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#8FA0C5" text-anchor="middle">RAW DEGRADED INPUT</text>
    
    <!-- Noisy Animated Waveform Line -->
    <path d="M 15 52 L 35 40 L 50 60 L 70 32 L 90 55 L 110 38 L 135 50" fill="none" stroke="#FF4466" stroke-width="1.8" opacity="0.9">
      <animate attributeName="d" 
        values="M 15 52 L 35 40 L 50 60 L 70 32 L 90 55 L 110 38 L 135 50;
                M 15 45 L 35 58 L 50 35 L 70 52 L 90 40 L 110 58 L 135 42;
                M 15 52 L 35 40 L 50 60 L 70 32 L 90 55 L 110 38 L 135 50" 
        dur="1.5s" repeatCount="indefinite" />
    </path>
    <text x="75" y="98" font-family="'Courier New', monospace" font-size="9" fill="#6075A0" text-anchor="middle">SD / NOISY FRAMES</text>
  </g>

  <!-- Arrow 1 with Moving Signal Pulses -->
  <g transform="translate(230, 275)" stroke="#00F2FF" stroke-width="1.8" fill="none" filter="url(#cyanGlow)">
    <line x1="0" y1="0" x2="45" y2="0" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.8s" repeatCount="indefinite" />
    </line>
    <polygon points="45,-5 54,0 45,5" fill="#00F2FF" stroke="none" />
  </g>

  <!-- Pipeline Stage 2: Neural Restoration Core -->
  <g transform="translate(294, 230)">
    <rect x="0" y="0" width="310" height="90" rx="10" fill="url(#glassCard)" stroke="url(#accentGrad)" stroke-width="1.8" filter="url(#cyanGlow)" />
    
    <!-- Glowing AI Core Circle -->
    <circle cx="48" cy="45" r="26" fill="#050e26" stroke="#00F2FF" stroke-width="1.5" />
    <polygon points="48,27 63,53 33,53" fill="none" stroke="#BC13FE" stroke-width="1.8">
      <animateTransform attributeName="transform" type="rotate" from="0 48 45" to="360 48 45" dur="10s" repeatCount="indefinite" />
    </polygon>
    <circle cx="48" cy="45" r="6" fill="#00FF88" filter="url(#greenGlow)">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite" />
    </circle>

    <text x="90" y="34" font-family="'Orbitron', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" letter-spacing="0.8">DEEP NEURAL ENGINE</text>
    <text x="90" y="54" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#00F2FF">Real-ESRGAN + CodeFormer</text>
    <text x="90" y="70" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#8FA0C5">FFmpeg Hardware Accel (NVENC)</text>

    <text x="155" y="108" font-family="'Courier New', monospace" font-size="9" fill="#BC13FE" text-anchor="middle" font-weight="bold">AI RESTORATION CORE</text>
  </g>

  <!-- Arrow 2 with Moving Signal Pulses -->
  <g transform="translate(614, 275)" stroke="#BC13FE" stroke-width="1.8" fill="none" filter="url(#purpleGlow)">
    <line x1="0" y1="0" x2="45" y2="0" stroke-dasharray="6,4">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.8s" repeatCount="indefinite" />
    </line>
    <polygon points="45,-5 54,0 45,5" fill="#BC13FE" stroke="none" />
  </g>

  <!-- Pipeline Stage 3: Restored Output -->
  <g transform="translate(669, 235)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#081024" stroke="#00FF88" stroke-width="1.5" opacity="0.95" filter="url(#cyanGlow)" />
    <text x="75" y="25" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#00FF88" text-anchor="middle">4K RESTORED OUTPUT</text>
    
    <!-- Smooth Animated Crystal Waveform Line -->
    <path d="M 15 50 Q 40 28 75 50 T 135 50" fill="none" stroke="#00FF88" stroke-width="2.2" filter="url(#greenGlow)">
      <animate attributeName="d" 
        values="M 15 50 Q 40 28 75 50 T 135 50;
                M 15 50 Q 40 68 75 50 T 135 50;
                M 15 50 Q 40 28 75 50 T 135 50" 
        dur="2.5s" repeatCount="indefinite" />
    </path>
    <text x="75" y="98" font-family="'Courier New', monospace" font-size="9" fill="#00FF88" text-anchor="middle">CRISP 60FPS VIDEO</text>
  </g>

  <!-- 6. TECH STACK BADGES AT FOOTER -->
  <g transform="translate(45, 390)">
    <rect x="0" y="0" width="95" height="26" rx="13" fill="#09152e" stroke="#00F2FF" stroke-width="1" />
    <text x="47.5" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#00F2FF" text-anchor="middle">PYTHON</text>

    <rect x="110" y="0" width="95" height="26" rx="13" fill="#09152e" stroke="#00F2FF" stroke-width="1" />
    <text x="157.5" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#00F2FF" text-anchor="middle">FFMPEG</text>

    <rect x="220" y="0" width="95" height="26" rx="13" fill="#09152e" stroke="#00F2FF" stroke-width="1" />
    <text x="267.5" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#00F2FF" text-anchor="middle">OPENCV</text>

    <rect x="330" y="0" width="95" height="26" rx="13" fill="#09152e" stroke="#BC13FE" stroke-width="1" />
    <text x="377.5" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#BC13FE" text-anchor="middle">PYTORCH</text>

    <rect x="440" y="0" width="115" height="26" rx="13" fill="#09152e" stroke="#BC13FE" stroke-width="1" />
    <text x="497.5" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#BC13FE" text-anchor="middle">REAL-ESRGAN</text>

    <!-- Right Side Metric Badge -->
    <text x="810" y="17" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#8FA0C5" text-anchor="end" letter-spacing="1">LATENCY: &lt;15ms/frame</text>
  </g>
</svg>
