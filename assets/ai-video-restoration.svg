<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040a16" />
      <stop offset="40%" stop-color="#050c1e" />
      <stop offset="80%" stop-color="#090620" />
      <stop offset="100%" stop-color="#0d0828" />
    </linearGradient>

    <!-- Glowing Text & Line Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradient for Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#BC13FE" />
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09132b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#050a18" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- 1. MAIN BACKGROUND -->
  <rect width="800" height="400" fill="url(#bgGrad)" rx="10" />

  <!-- 2. TECH GRID PATTERN -->
  <g stroke="#00F2FF" stroke-width="0.5" opacity="0.08">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="440" y1="0" x2="440" y2="400" />
    <line x1="520" y1="0" x2="520" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="680" y1="0" x2="680" y2="400" />
    <line x1="760" y1="0" x2="760" y2="400" />
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Outer Glass Frame -->
  <rect x="12" y="12" width="776" height="376" rx="8" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" opacity="0.8" filter="url(#cyanGlow)" />

  <!-- Corner Tech Brackets -->
  <path d="M 12 30 L 12 12 L 30 12" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 788 30 L 788 12 L 770 12" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 12 370 L 12 388 L 30 388" fill="none" stroke="#BC13FE" stroke-width="2.5" />
  <path d="M 788 370 L 788 388 L 770 388" fill="none" stroke="#BC13FE" stroke-width="2.5" />

  <!-- 3. HEADER BADGE & STATUS -->
  <g transform="translate(40, 42)">
    <!-- Status Dot -->
    <circle cx="6" cy="6" r="4" fill="#00FF88" filter="url(#cyanGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#00FF88" letter-spacing="1.5">SYSTEM_ONLINE // PIPELINE_ACTIVE</text>

    <!-- Tag Pill Right -->
    <rect x="580" y="-6" width="140" height="24" rx="12" fill="#071329" stroke="#00F2FF" stroke-width="1" opacity="0.9" />
    <text x="650" y="10" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#00F2FF" text-anchor="middle" letter-spacing="1">AI ENGINE v2.4</text>
  </g>

  <!-- Decorative Separator Line -->
  <line x1="40" y1="68" x2="760" y2="68" stroke="#102548" stroke-width="1" />

  <!-- 4. TITLE & SUBTITLE SECTION -->
  <g transform="translate(40, 115)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
      AI VIDEO RESTORATION
    </text>

    <!-- Highlight Tag -->
    <text x="0" y="30" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="url(#accentGrad)" letter-spacing="2.5" filter="url(#cyanGlow)">
      PIPELINE ARCHITECTURE
    </text>

    <text x="0" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8FA0C5" letter-spacing="0.5">
      Automated Frame Enhancement · Noise Reduction · Super-Resolution
    </text>
  </g>

  <!-- 5. VISUAL PIPELINE FLOW DIAGRAM -->
  <!-- Glass Card Box for Diagram -->
  <rect x="40" y="200" width="720" height="125" rx="8" fill="url(#glassCard)" stroke="#162a52" stroke-width="1" />

  <!-- Pipeline Stage 1: Input Video Frame -->
  <g transform="translate(65, 220)">
    <rect x="0" y="0" width="130" height="70" rx="6" fill="#081024" stroke="#00F2FF" stroke-width="1.2" opacity="0.9" />
    <text x="65" y="25" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" fill="#8FA0C5" text-anchor="middle">RAW INPUT</text>
    <!-- Noisy signal line -->
    <path d="M 20 48 L 35 40 L 45 55 L 60 35 L 75 50 L 90 42 L 110 48" fill="none" stroke="#FF4466" stroke-width="1.5" opacity="0.8" />
    <text x="65" y="86" font-family="'Segoe UI', sans-serif" font-size="9" fill="#6075A0" text-anchor="middle">Degraded Frames</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(205, 250)" stroke="#00F2FF" stroke-width="1.5" fill="none" filter="url(#cyanGlow)">
    <line x1="0" y1="0" x2="35" y2="0" />
    <polygon points="35,-4 43,0 35,4" fill="#00F2FF" stroke="none" />
  </g>

  <!-- Pipeline Stage 2: Neural Restoration Core -->
  <g transform="translate(258, 215)">
    <rect x="0" y="0" width="260" height="80" rx="8" fill="url(#glassCard)" stroke="url(#accentGrad)" stroke-width="1.5" filter="url(#cyanGlow)" />
    <!-- Glowing AI Core Circle -->
    <circle cx="40" cy="40" r="22" fill="#050e26" stroke="#00F2FF" stroke-width="1.5" />
    <polygon points="40,24 53,46 27,46" fill="none" stroke="#BC13FE" stroke-width="1.5" />
    <circle cx="40" cy="40" r="5" fill="#00F2FF" filter="url(#cyanGlow)" />

    <text x="75" y="32" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">DEEP NEURAL ENGINE</text>
    <text x="75" y="50" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00F2FF">Real-ESRGAN + CodeFormer</text>
    <text x="75" y="65" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8FA0C5">FFmpeg Hardware Accel</text>

    <text x="130" y="96" font-family="'Segoe UI', sans-serif" font-size="9" fill="#BC13FE" text-anchor="middle" font-weight="bold">AI RESTORATION CORE</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(528, 250)" stroke="#BC13FE" stroke-width="1.5" fill="none" filter="url(#purpleGlow)">
    <line x1="0" y1="0" x2="35" y2="0" />
    <polygon points="35,-4 43,0 35,4" fill="#BC13FE" stroke="none" />
  </g>

  <!-- Pipeline Stage 3: Restored Output -->
  <g transform="translate(573, 220)">
    <rect x="0" y="0" width="130" height="70" rx="6" fill="#081024" stroke="#00FF88" stroke-width="1.2" opacity="0.9" filter="url(#cyanGlow)" />
    <text x="65" y="25" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="bold" fill="#00FF88" text-anchor="middle">4K ENHANCED</text>
    <!-- Smooth crystal signal line -->
    <path d="M 20 45 Q 40 25 65 45 T 110 45" fill="none" stroke="#00FF88" stroke-width="2" />
    <text x="65" y="86" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00FF88" text-anchor="middle">Restored Video</text>
  </g>

  <!-- 6. TECH STACK BADGES AT FOOTER -->
  <g transform="translate(40, 345)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="#09152e" stroke="#00F2FF" stroke-width="0.8" />
    <text x="42.5" y="15" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#00F2FF" text-anchor="middle">PYTHON</text>

    <rect x="95" y="0" width="85" height="24" rx="12" fill="#09152e" stroke="#00F2FF" stroke-width="0.8" />
    <text x="137.5" y="15" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#00F2FF" text-anchor="middle">FFMPEG</text>

    <rect x="190" y="0" width="85" height="24" rx="12" fill="#09152e" stroke="#00F2FF" stroke-width="0.8" />
    <text x="232.5" y="15" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#00F2FF" text-anchor="middle">OPENCV</text>

    <rect x="285" y="0" width="85" height="24" rx="12" fill="#09152e" stroke="#BC13FE" stroke-width="0.8" />
    <text x="327.5" y="15" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#BC13FE" text-anchor="middle">PYTORCH</text>

    <rect x="380" y="0" width="105" height="24" rx="12" fill="#09152e" stroke="#BC13FE" stroke-width="0.8" />
    <text x="432.5" y="15" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#BC13FE" text-anchor="middle">REAL-ESRGAN</text>

    <!-- Right Side Metric Badge -->
    <text x="720" y="15" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#8FA0C5" text-anchor="end" letter-spacing="1">LATENCY: &lt;15ms/frame</text>
  </g>
</svg>
