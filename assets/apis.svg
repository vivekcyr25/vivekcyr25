<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="apisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040a16" />
      <stop offset="50%" stop-color="#060f22" />
      <stop offset="100%" stop-color="#0b0826" />
    </linearGradient>
    <filter id="apisCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="apisPurpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="apisGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#040918" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="apisBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#5533FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#BC13FE" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="apisBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#BC13FE" />
    </linearGradient>
  </defs>

  <rect width="900" height="450" fill="url(#apisBg)" rx="10" />
  <g stroke="#00F2FF" stroke-width="0.5" opacity="0.07">
    <line x1="45" y1="0" x2="45" y2="450" /><line x1="135" y1="0" x2="135" y2="450" />
    <line x1="225" y1="0" x2="225" y2="450" /><line x1="315" y1="0" x2="315" y2="450" />
    <line x1="405" y1="0" x2="405" y2="450" /><line x1="495" y1="0" x2="495" y2="450" />
    <line x1="585" y1="0" x2="585" y2="450" /><line x1="675" y1="0" x2="675" y2="450" />
    <line x1="765" y1="0" x2="765" y2="450" /><line x1="855" y1="0" x2="855" y2="450" />
    <line x1="0" y1="45" x2="900" y2="45" /><line x1="0" y1="135" x2="900" y2="135" />
    <line x1="0" y1="225" x2="900" y2="225" /><line x1="0" y1="315" x2="900" y2="315" />
    <line x1="0" y1="405" x2="900" y2="405" />
  </g>
  <rect x="14" y="14" width="872" height="422" rx="8" fill="none" stroke="url(#apisBorder)" stroke-width="1.2" filter="url(#apisCyanGlow)" />
  <path d="M 14 34 L 14 14 L 34 14" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 886 34 L 886 14 L 866 14" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 14 416 L 14 436 L 34 436" fill="none" stroke="#BC13FE" stroke-width="2.5" />
  <path d="M 886 416 L 886 436 L 866 436" fill="none" stroke="#BC13FE" stroke-width="2.5" />

  <g transform="translate(45, 50)">
