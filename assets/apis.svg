  <path d="M 310 225 L 440 225" stroke="#00F2FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="1s" repeatCount="indefinite" />
  </path>
  <circle cx="440" cy="225" r="3.5" fill="#00F2FF" filter="url(#apisCyanGlow)" />

  <g transform="translate(440, 50)">
    <rect x="0" y="0" width="415" height="340" rx="10" fill="url(#apisGlass)" stroke="url(#apisBorder)" stroke-width="1.5" filter="url(#apisCyanGlow)" />
    <g transform="translate(252, 20)">
      <rect x="0" y="0" width="148" height="26" rx="13" fill="#091b38" stroke="#00FF88" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#00FF88" filter="url(#apisCyanGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="bold" fill="#00FF88" letter-spacing="0.35">ACTIVE MISSION</text>
    </g>
    <text x="28" y="66" font-family="Segoe UI, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="2">APIS</text>
    <text x="28" y="92" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#00F2FF" letter-spacing="1.2">ACADEMIC INTELLIGENCE</text>
    <text x="28" y="125" font-family="Segoe UI, sans-serif" font-size="12" fill="#8FA0C5">Ambient-intelligence academic memory</text>
    <text x="28" y="143" font-family="Segoe UI, sans-serif" font-size="12" fill="#8FA0C5">system for students and researchers.</text>
    <g transform="translate(28, 175)">
      <circle cx="4" cy="4" r="3.5" fill="#00F2FF" />
      <text x="18" y="8" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#CBE0FF">Gemini AI academic reasoning core</text>
      <circle cx="4" cy="30" r="3.5" fill="#00F2FF" />
      <text x="18" y="34" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#CBE0FF">Vite + React + Firebase full stack</text>
      <polygon points="4,52 8,58 0,58" fill="#00FF88" />
      <text x="18" y="57" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#CBE0FF">Persistent academic memory graphs</text>
    </g>
    <g transform="translate(28, 268)">
      <rect x="0" y="0" width="105" height="34" rx="17" fill="url(#apisBtn)" />
      <text x="52.5" y="21" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#050a18" text-anchor="middle" letter-spacing="1">EXPLORE</text>
    </g>
    <text x="155" y="290" font-family="Courier New, monospace" font-size="9.5" font-weight="bold" fill="#00F2FF" letter-spacing="1">GEMINI AI</text>
    <text x="270" y="290" font-family="Courier New, monospace" font-size="9.5" font-weight="bold" fill="#BC13FE" letter-spacing="1">FULL STACK</text>
  </g>
  <text x="45" y="420" font-family="Courier New, monospace" font-size="8.5" fill="#40557d" letter-spacing="1">APIS V1.0 2026 // ACADEMIC INTELLIGENCE LAB</text>
