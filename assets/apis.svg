      <rect x="8" y="0" width="4.5" height="18" rx="1"><animate attributeName="height" values="20;6;24;10;20" dur="1.4s" repeatCount="indefinite" /><animate attributeName="y" values="0;12;0;8;0" dur="1.4s" repeatCount="indefinite" /></rect>
      <rect x="16" y="0" width="4.5" height="18" rx="1"><animate attributeName="height" values="10;24;8;20;10" dur="1.1s" repeatCount="indefinite" /><animate attributeName="y" values="8;0;10;0;8" dur="1.1s" repeatCount="indefinite" /></rect>
      <rect x="24" y="0" width="4.5" height="18" rx="1"><animate attributeName="height" values="24;10;18;6;24" dur="1.3s" repeatCount="indefinite" /><animate attributeName="y" values="0;8;0;12;0" dur="1.3s" repeatCount="indefinite" /></rect>
      <rect x="32" y="0" width="4.5" height="18" rx="1"><animate attributeName="height" values="14;26;10;20;14" dur="1.5s" repeatCount="indefinite" /><animate attributeName="y" values="4;0;8;0;4" dur="1.5s" repeatCount="indefinite" /></rect>
    </g>
  </g>

  <g transform="translate(175, 180)">
