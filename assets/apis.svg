    <text x="16" y="20" font-family="Courier New, monospace" font-size="8.5" fill="#8FA0C5">STACK</text>
    <text x="16" y="46" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">VITE</text>
    <text x="16" y="68" font-family="Courier New, monospace" font-size="9" fill="#00F2FF">REACT + FIREBASE</text>
