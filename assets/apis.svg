<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="apisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070c"/>
      <stop offset="50%" stop-color="#0c0a12"/>
      <stop offset="100%" stop-color="#120a0c"/>
    </linearGradient>
    <radialGradient id="apisOrb1" cx="25%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#FF8A5B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF8A5B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apisOrb2" cx="80%" cy="65%" r="38%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="apisGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18141f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d0b12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="apisBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#F0A070" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF8A5B"/>
    </linearGradient>
    <linearGradient id="apisBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#FF8A5B"/>
    </linearGradient>
    <linearGradient id="apisShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="apisGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="apisSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="apisCardClip"><rect x="0" y="0" width="415" height="340" rx="10"/></clipPath>
  </defs>

  <rect width="900" height="450" fill="url(#apisBg)" rx="10"/>
  <ellipse cx="200" cy="150" rx="210" ry="155" fill="url(#apisOrb1)">
    <animate attributeName="rx" values="210;240;210" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="740" cy="300" rx="190" ry="140" fill="url(#apisOrb2)">
    <animate attributeName="cy" values="300;270;300" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#5EEAD4" stroke-width="0.5" opacity="0.07">
    <line x1="45" y1="0" x2="45" y2="450"/><line x1="135" y1="0" x2="135" y2="450"/>
    <line x1="225" y1="0" x2="225" y2="450"/><line x1="315" y1="0" x2="315" y2="450"/>
    <line x1="405" y1="0" x2="405" y2="450"/><line x1="495" y1="0" x2="495" y2="450"/>
    <line x1="585" y1="0" x2="585" y2="450"/><line x1="675" y1="0" x2="675" y2="450"/>
    <line x1="765" y1="0" x2="765" y2="450"/><line x1="855" y1="0" x2="855" y2="450"/>
    <line x1="0" y1="45" x2="900" y2="45"/><line x1="0" y1="135" x2="900" y2="135"/>
    <line x1="0" y1="225" x2="900" y2="225"/><line x1="0" y1="315" x2="900" y2="315"/>
    <line x1="0" y1="405" x2="900" y2="405"/>
  </g>

  <g fill="#FF8A5B" opacity="0.65">
    <circle cx="90" cy="90" r="1.5"><animate attributeName="cy" values="90;50;90" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="360" r="1.7" fill="#5EEAD4"><animate attributeName="cx" values="280;310;280" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="120" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="400" r="1.4" fill="#5EEAD4"><animate attributeName="cy" values="400;360;400" dur="7s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="14" y="14" width="872" height="422" rx="8" fill="none" stroke="url(#apisBorder)" stroke-width="1.3" filter="url(#apisGlow)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <path d="M 14 34 L 14 14 L 34 14" fill="none" stroke="#5EEAD4" stroke-width="2.5"/>
  <path d="M 886 34 L 886 14 L 866 14" fill="none" stroke="#5EEAD4" stroke-width="2.5"/>
  <path d="M 14 416 L 14 436 L 34 436" fill="none" stroke="#FF8A5B" stroke-width="2.5"/>
  <path d="M 886 416 L 886 436 L 866 436" fill="none" stroke="#FF8A5B" stroke-width="2.5"/>

  <g transform="translate(45, 50)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#apisGlass)" stroke="#2a2433" stroke-width="1"/>
    <text x="16" y="24" font-family="Courier New, monospace" font-size="9" fill="#5EEAD4" letter-spacing="1.5">MEMORY ENGINE</text>
    <text x="16" y="54" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">GEMINI</text>
    <text x="16" y="74" font-family="Courier New, monospace" font-size="8.5" fill="#FF8A5B">ACADEMIC AI CORE</text>
    <!-- hex pulse -->
    <g transform="translate(155, 42)" filter="url(#apisGlow)">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#5EEAD4" stroke-width="1.5">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </polygon>
      <circle cx="0" cy="0" r="4" fill="#FF8A5B">
        <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(16, 86)" fill="#FF8A5B">
      <rect x="0" y="0" width="5" height="18" rx="1"><animate attributeName="height" values="8;22;6;20;8" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="10;0;12;0;10" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="9" y="0" width="5" height="18" rx="1" fill="#5EEAD4"><animate attributeName="height" values="20;6;24;10;20" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="0;12;0;8;0" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="18" y="0" width="5" height="18" rx="1"><animate attributeName="height" values="10;24;8;20;10" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="8;0;10;0;8" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="27" y="0" width="5" height="18" rx="1" fill="#5EEAD4"><animate attributeName="height" values="24;10;18;6;24" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="0;8;0;12;0" dur="1.25s" repeatCount="indefinite"/></rect>
      <rect x="36" y="0" width="5" height="18" rx="1"><animate attributeName="height" values="14;26;10;20;14" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="4;0;8;0;4" dur="1.4s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(175, 180)">
    <rect x="0" y="0" width="150" height="95" rx="8" fill="url(#apisGlass)" stroke="#2a2433" stroke-width="1"/>
    <text x="16" y="20" font-family="Courier New, monospace" font-size="8.5" fill="#9a90a8">STACK</text>
    <text x="16" y="46" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">VITE</text>
    <text x="16" y="68" font-family="Courier New, monospace" font-size="9" fill="#5EEAD4">REACT + FIREBASE</text>
    <!-- waveform -->
    <path d="M 90 55 Q 100 40 110 55 T 130 55" fill="none" stroke="#FF8A5B" stroke-width="2" filter="url(#apisGlow)">
      <animate attributeName="d" values="M 90 55 Q 100 40 110 55 T 130 55;M 90 55 Q 100 70 110 55 T 130 55;M 90 55 Q 100 40 110 55 T 130 55" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(45, 290)">
    <rect x="0" y="0" width="220" height="100" rx="8" fill="url(#apisGlass)" stroke="#2a2433" stroke-width="1"/>
    <text x="16" y="20" font-family="Courier New, monospace" font-size="8.5" fill="#9a90a8">MISSION STATUS</text>
    <text x="16" y="48" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Active Build</text>
    <text x="16" y="68" font-family="Courier New, monospace" font-size="8.5" fill="#5EEAD4">AMBIENT INTELLIGENCE</text>
    <rect x="16" y="80" width="180" height="6" rx="3" fill="#1a1622"/>
    <rect x="16" y="80" width="50" height="6" rx="3" fill="url(#apisBtn)" filter="url(#apisGlow)">
      <animate attributeName="width" values="50;175;120;50" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M 310 225 L 440 225" stroke="#FF8A5B" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.7" filter="url(#apisGlow)">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.85s" repeatCount="indefinite"/>
  </path>
  <circle cx="375" cy="225" r="3" fill="#5EEAD4" filter="url(#apisGlow)">
    <animate attributeName="cx" values="320;430;320" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="225" r="4" fill="#FF8A5B" filter="url(#apisGlow)">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(440, 50)">
    <rect x="0" y="0" width="415" height="340" rx="10" fill="url(#apisGlass)" stroke="url(#apisBorder)" stroke-width="1.6" filter="url(#apisGlow)"/>
    <g clip-path="url(#apisCardClip)">
      <rect x="0" y="0" width="415" height="22" fill="#5EEAD4" opacity="0.07">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,318; 0,0" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(248, 18)">
      <rect x="0" y="0" width="152" height="28" rx="14" fill="#14101a" stroke="#5EEAD4" stroke-width="1"/>
      <circle cx="15" cy="14" r="4" fill="#5EEAD4" filter="url(#apisGlow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="bold" fill="#5EEAD4" letter-spacing="0.4">ACTIVE MISSION</text>
    </g>

    <text x="28" y="70" font-family="Segoe UI, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="3">APIS</text>
    <text x="28" y="98" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#FF8A5B" letter-spacing="1.3">ACADEMIC INTELLIGENCE</text>
    <text x="28" y="130" font-family="Segoe UI, sans-serif" font-size="12" fill="#B5A8C4">Ambient-intelligence academic memory</text>
    <text x="28" y="148" font-family="Segoe UI, sans-serif" font-size="12" fill="#B5A8C4">system for students and researchers.</text>

    <g transform="translate(28, 180)">
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
        <circle cx="5" cy="5" r="4" fill="#5EEAD4" filter="url(#apisGlow)"/>
        <text x="20" y="9" font-family="Segoe UI, sans-serif" font-size="12" fill="#F0EAF8">Gemini AI academic reasoning core</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
        <circle cx="5" cy="32" r="4" fill="#FF8A5B" filter="url(#apisGlow)"/>
        <text x="20" y="36" font-family="Segoe UI, sans-serif" font-size="12" fill="#F0EAF8">Vite + React + Firebase full stack</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
        <polygon points="5,55 10,63 0,63" fill="#5EEAD4"/>
        <text x="20" y="62" font-family="Segoe UI, sans-serif" font-size="12" fill="#F0EAF8">Persistent academic memory graphs</text>
      </g>
    </g>

    <g transform="translate(28, 275)">
      <rect x="0" y="0" width="118" height="36" rx="18" fill="url(#apisBtn)" filter="url(#apisGlow)"/>
      <rect x="-40" y="0" width="40" height="36" fill="url(#apisShine)">
        <animate attributeName="x" values="-40;-40;130;130" keyTimes="0;0.1;0.45;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="59" y="23" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#0c0a10" text-anchor="middle" letter-spacing="1.2">EXPLORE</text>
    </g>
    <text x="165" y="298" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#5EEAD4" letter-spacing="1">GEMINI AI</text>
    <text x="280" y="298" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#FF8A5B" letter-spacing="1">FULL STACK</text>
  </g>

  <text x="45" y="420" font-family="Courier New, monospace" font-size="8.5" fill="#4a4258" letter-spacing="1">APIS V2.0 2026 // ACADEMIC INTELLIGENCE</text>
  <text x="855" y="420" font-family="Courier New, monospace" font-size="8.5" fill="#FF8A5B" text-anchor="end" letter-spacing="1">
    ENGAGED
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>
