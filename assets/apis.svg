    <text x="16" y="20" font-family="Courier New, monospace" font-size="8.5" fill="#8FA0C5">MISSION STATUS</text>
    <text x="16" y="52" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Active Build</text>
    <text x="16" y="74" font-family="Courier New, monospace" font-size="8.5" fill="#00FF88">AMBIENT INTELLIGENCE</text>
    <text x="16" y="90" font-family="Courier New, monospace" font-size="8" fill="#8FA0C5">ACADEMIC MEMORY SYSTEM</text>
