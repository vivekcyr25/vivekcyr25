<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07111f"/>
    <stop offset="100%" stop-color="#050d18"/>
  </linearGradient>
  <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="900" height="100" fill="url(#bg)" rx="6"/>


<!-- ══════════════════════════════════════
     CARD 1 — LinkedIn
══════════════════════════════════════ -->
<a href="https://www.linkedin.com/in/vivek-sharma-2bba8b398/" target="_blank">
  <rect x="4" y="4" width="142" height="92" rx="8" fill="#05101e"/>
  <rect x="4" y="4" width="142" height="92" rx="8" fill="none" stroke="#0A66C2" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.25;0.85;0.25" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- LinkedIn logo: official blue square + white "in" -->
  <g transform="translate(51,12)">
    <rect width="48" height="48" rx="8" fill="#0A66C2" filter="url(#gl)"/>
    <g fill="white">
      <!-- i — dot -->
      <circle cx="14" cy="14" r="4"/>
      <!-- i — stem -->
      <rect x="10" y="20.5" width="8" height="18" rx="1"/>
      <!-- n -->
      <path d="M23,20.5 h7 v3.5 c1.5-3 4.5-4.2 7.5-4.2 c6.5,0,8.5,4,8.5,10 v9.2 h-8 v-7.8 c0-3-1-4.5-3.2-4.5 c-2.8,0-3.8,2-3.8,5 v7.3 h-8 z"/>
    </g>
  </g>

  <text x="75" y="74" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600"
        fill="#4da8ff" text-anchor="middle" letter-spacing="0.3">LinkedIn</text>
</a>


<!-- ══════════════════════════════════════
     CARD 2 — Gmail
     Gmail M: white 48×48 bg, M from x=2..46 y=7..41
     Valley at (24,25). Dividers at x=13(y=16) and x=35(y=16)
     4 sections: Red | Blue | Yellow | Green
══════════════════════════════════════ -->
<a href="mailto:viveklpu008@gmail.com" target="_blank">
  <rect x="152" y="4" width="142" height="92" rx="8" fill="#100505"/>
  <rect x="152" y="4" width="142" height="92" rx="8" fill="none" stroke="#EA4335" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.25;0.85;0.25" dur="2.8s" repeatCount="indefinite" begin="0.4s"/>
  </rect>

  <!-- Gmail logo on white bg -->
  <g transform="translate(199,12)">
    <rect width="48" height="48" rx="8" fill="white"/>
    <!--
      M occupies x=2..46, y=7..41  (44px wide, 34px tall)
      Left diagonal:  (2,7)  → (24,25)
      Right diagonal: (46,7) → (24,25)
      Vertical cuts at x=13 and x=35
        x=13 on left diag  → y=7 + 18*(13-2)/22 = 7+9  = 16  → (13,16)
        x=35 on right diag → y=7 + 18*(46-35)/22 = 7+9  = 16  → (35,16)
    -->
    <!-- Red  – left outer leg -->
    <polygon points="2,7  13,16 13,41 2,41"   fill="#EA4335"/>
    <!-- Blue – left inner diagonal -->
    <polygon points="13,16 24,25 24,41 13,41" fill="#4285F4"/>
    <!-- Yellow – right inner diagonal -->
    <polygon points="24,25 35,16 35,41 24,41" fill="#FBBC05"/>
    <!-- Green – right outer leg -->
    <polygon points="35,16 46,7  46,41 35,41" fill="#34A853"/>
  </g>

  <text x="223" y="74" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600"
        fill="#ff7060" text-anchor="middle" letter-spacing="0.3">Gmail</text>
</a>


