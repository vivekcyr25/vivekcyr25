<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="apmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0a"/>
      <stop offset="45%" stop-color="#0a1210"/>
      <stop offset="100%" stop-color="#120e08"/>
    </linearGradient>
    <radialGradient id="apmOrb1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#3DFFB5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3DFFB5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="apmOrb2" cx="85%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#E8C547" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E8C547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="apmGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102018" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0a100c" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="apmBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DFFB5"/>
      <stop offset="50%" stop-color="#A8D48A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8C547"/>
    </linearGradient>
    <linearGradient id="apmBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3DFFB5"/>
      <stop offset="100%" stop-color="#E8C547"/>
    </linearGradient>
    <linearGradient id="apmShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="apmGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="apmSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="apmPanelClip"><rect x="0" y="0" width="415" height="340" rx="10"/></clipPath>
  </defs>

  <rect width="900" height="450" fill="url(#apmBg)" rx="10"/>
  <ellipse cx="180" cy="140" rx="220" ry="160" fill="url(#apmOrb1)">
    <animate attributeName="cx" values="180;210;180" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.55;0.9" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="760" cy="310" rx="200" ry="150" fill="url(#apmOrb2)">
    <animate attributeName="cy" values="310;280;310" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#3DFFB5" stroke-width="0.5" opacity="0.08">
    <line x1="45" y1="0" x2="45" y2="450"/><line x1="135" y1="0" x2="135" y2="450"/>
    <line x1="225" y1="0" x2="225" y2="450"/><line x1="315" y1="0" x2="315" y2="450"/>
    <line x1="405" y1="0" x2="405" y2="450"/><line x1="495" y1="0" x2="495" y2="450"/>
    <line x1="585" y1="0" x2="585" y2="450"/><line x1="675" y1="0" x2="675" y2="450"/>
    <line x1="765" y1="0" x2="765" y2="450"/><line x1="855" y1="0" x2="855" y2="450"/>
    <line x1="0" y1="45" x2="900" y2="45"/><line x1="0" y1="135" x2="900" y2="135"/>
    <line x1="0" y1="225" x2="900" y2="225"/><line x1="0" y1="315" x2="900" y2="315"/>
    <line x1="0" y1="405" x2="900" y2="405"/>
  </g>

  <!-- drifting particles -->
  <g fill="#E8C547" opacity="0.7">
    <circle cx="80" cy="100" r="1.5"><animate attributeName="cy" values="100;60;100" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="380" r="1.8" fill="#3DFFB5"><animate attributeName="cy" values="380;330;380" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="80" r="1.4"><animate attributeName="cx" values="700;740;700" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="200" r="1.6" fill="#3DFFB5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="14" y="14" width="872" height="422" rx="8" fill="none" stroke="url(#apmBorder)" stroke-width="1.3" filter="url(#apmGlow)">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <path d="M 14 34 L 14 14 L 34 14" fill="none" stroke="#3DFFB5" stroke-width="2.5"/>
  <path d="M 886 34 L 886 14 L 866 14" fill="none" stroke="#3DFFB5" stroke-width="2.5"/>
  <path d="M 14 416 L 14 436 L 34 436" fill="none" stroke="#E8C547" stroke-width="2.5"/>
  <path d="M 886 416 L 886 436 L 866 436" fill="none" stroke="#E8C547" stroke-width="2.5"/>

  <!-- LEFT WIDGETS -->
  <g transform="translate(45, 50)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#apmGlass)" stroke="#1a3328" stroke-width="1"/>
    <text x="16" y="24" font-family="Courier New, monospace" font-size="9" fill="#3DFFB5" letter-spacing="1.5">AI CORE</text>
    <text x="16" y="54" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">GROQ</text>
    <text x="90" y="54" font-family="Segoe UI, sans-serif" font-size="11" fill="#E8C547">LIVE</text>
    <text x="16" y="74" font-family="Courier New, monospace" font-size="8.5" fill="#7dcea0">LLAMA 3.3 STREAMING</text>
    <!-- rotating arc ring -->
    <circle cx="160" cy="48" r="18" fill="none" stroke="#1a3328" stroke-width="3"/>
    <circle cx="160" cy="48" r="18" fill="none" stroke="#3DFFB5" stroke-width="3" stroke-dasharray="40 80" stroke-linecap="round" filter="url(#apmGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 160 48" to="360 160 48" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(16, 86)" fill="#E8C547">
      <rect x="0" y="0" width="5" height="18" rx="1"><animate attributeName="height" values="8;22;6;20;8" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="10;0;12;0;10" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="9" y="0" width="5" height="18" rx="1" fill="#3DFFB5"><animate attributeName="height" values="20;6;24;10;20" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="0;12;0;8;0" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="18" y="0" width="5" height="18" rx="1"><animate attributeName="height" values="10;24;8;20;10" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="8;0;10;0;8" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="27" y="0" width="5" height="18" rx="1" fill="#3DFFB5"><animate attributeName="height" values="24;10;18;6;24" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="0;8;0;12;0" dur="1.25s" repeatCount="indefinite"/></rect>
      <rect x="36" y="0" width="5" height="18" rx="1"><animate attributeName="height" values="14;26;10;20;14" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="4;0;8;0;4" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="45" y="0" width="5" height="18" rx="1" fill="#3DFFB5"><animate attributeName="height" values="18;8;22;12;18" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="0;10;0;6;0" dur="1.15s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(175, 180)">
    <rect x="0" y="0" width="150" height="95" rx="8" fill="url(#apmGlass)" stroke="#1a3328" stroke-width="1"/>
    <text x="16" y="20" font-family="Courier New, monospace" font-size="8.5" fill="#9bb5a8">AUTH STACK</text>
    <text x="16" y="46" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">OAUTH</text>
    <text x="16" y="68" font-family="Courier New, monospace" font-size="9" fill="#E8C547">GOOGLE + GITHUB</text>
    <circle cx="120" cy="55" r="6" fill="#3DFFB5" filter="url(#apmSoft)">
      <animate attributeName="r" values="5;7.5;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(45, 290)">
    <rect x="0" y="0" width="220" height="100" rx="8" fill="url(#apmGlass)" stroke="#1a3328" stroke-width="1"/>
    <text x="16" y="20" font-family="Courier New, monospace" font-size="8.5" fill="#9bb5a8">UI SYSTEM</text>
    <text x="16" y="48" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Liquid Glass</text>
    <text x="16" y="68" font-family="Courier New, monospace" font-size="8.5" fill="#3DFFB5">iOS 26 GLASSMORPHISM</text>
    <!-- progress bar -->
    <rect x="16" y="80" width="180" height="6" rx="3" fill="#14241c"/>
    <rect x="16" y="80" width="40" height="6" rx="3" fill="url(#apmBtn)" filter="url(#apmGlow)">
      <animate attributeName="width" values="40;170;110;40" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M 310 225 L 440 225" stroke="#3DFFB5" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.65" filter="url(#apmGlow)">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <circle cx="440" cy="225" r="4" fill="#E8C547" filter="url(#apmGlow)">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- MAIN PANEL -->
  <g transform="translate(440, 50)">
    <rect x="0" y="0" width="415" height="340" rx="10" fill="url(#apmGlass)" stroke="url(#apmBorder)" stroke-width="1.6" filter="url(#apmGlow)"/>
    <!-- scanline -->
    <g clip-path="url(#apmPanelClip)">
      <rect x="0" y="0" width="415" height="22" fill="#3DFFB5" opacity="0.07">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,318; 0,0" dur="5.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(248, 18)">
      <rect x="0" y="0" width="152" height="28" rx="14" fill="#0d1a14" stroke="#E8C547" stroke-width="1"/>
      <circle cx="15" cy="14" r="4" fill="#E8C547" filter="url(#apmGlow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="bold" fill="#E8C547" letter-spacing="0.4">PRODUCTION READY</text>
    </g>

    <text x="28" y="68" font-family="Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="1">AI PORTFOLIO</text>
    <text x="28" y="96" font-family="Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#3DFFB5" letter-spacing="2">MAKER</text>
    <text x="28" y="128" font-family="Segoe UI, sans-serif" font-size="12" fill="#A8C4B5">Cinematic AI operating system and</text>
    <text x="28" y="146" font-family="Segoe UI, sans-serif" font-size="12" fill="#A8C4B5">portfolio ecosystem for architects.</text>

    <g transform="translate(28, 178)">
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
        <circle cx="5" cy="5" r="4" fill="#3DFFB5" filter="url(#apmGlow)"/>
        <text x="20" y="9" font-family="Segoe UI, sans-serif" font-size="12" fill="#E8F5EE">Groq-powered real-time AI streaming</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
        <circle cx="5" cy="32" r="4" fill="#E8C547" filter="url(#apmGlow)"/>
        <text x="20" y="36" font-family="Segoe UI, sans-serif" font-size="12" fill="#E8F5EE">Firebase Auth with Google + GitHub</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
        <polygon points="5,55 10,63 0,63" fill="#3DFFB5"/>
        <text x="20" y="62" font-family="Segoe UI, sans-serif" font-size="12" fill="#E8F5EE">Liquid glass UI with Framer Motion</text>
      </g>
    </g>

    <g transform="translate(28, 275)">
      <rect x="0" y="0" width="118" height="36" rx="18" fill="url(#apmBtn)" filter="url(#apmGlow)"/>
      <rect x="-40" y="0" width="40" height="36" fill="url(#apmShine)" opacity="0.9">
        <animate attributeName="x" values="-40;-40;130;130" keyTimes="0;0.1;0.45;1" dur="3.8s" repeatCount="indefinite"/>
      </rect>
      <text x="59" y="23" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#07110c" text-anchor="middle" letter-spacing="1.2">EXPLORE</text>
    </g>
    <text x="165" y="298" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#3DFFB5" letter-spacing="1">NEURAL OS</text>
    <text x="280" y="298" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#E8C547" letter-spacing="1">TYPESCRIPT</text>
  </g>

  <text x="45" y="420" font-family="Courier New, monospace" font-size="8.5" fill="#3a5248" letter-spacing="1">APM V2.0 2026 // AI PORTFOLIO MAKER</text>
  <text x="855" y="420" font-family="Courier New, monospace" font-size="8.5" fill="#3DFFB5" text-anchor="end" letter-spacing="1">
    LIVE
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </text>
</svg>
