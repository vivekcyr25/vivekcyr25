<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040916" />
      <stop offset="50%" stop-color="#060c20" />
      <stop offset="100%" stop-color="#0c0726" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="spCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="spPurpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glass Panel Fill -->
    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09142b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#050a18" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#BC13FE" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
  </defs>

  <!-- 1. BACKGROUND -->
  <rect width="900" height="450" fill="url(#spBg)" rx="10" />

  <!-- Grid lines -->
  <g stroke="#00F2FF" stroke-width="0.5" opacity="0.07">
    <line x1="45" y1="0" x2="45" y2="450" />
    <line x1="135" y1="0" x2="135" y2="450" />
    <line x1="225" y1="0" x2="225" y2="450" />
    <line x1="315" y1="0" x2="315" y2="450" />
    <line x1="405" y1="0" x2="405" y2="450" />
    <line x1="495" y1="0" x2="495" y2="450" />
    <line x1="585" y1="0" x2="585" y2="450" />
    <line x1="675" y1="0" x2="675" y2="450" />
    <line x1="765" y1="0" x2="765" y2="450" />
    <line x1="855" y1="0" x2="855" y2="450" />
    <line x1="0" y1="45" x2="900" y2="45" />
    <line x1="0" y1="135" x2="900" y2="135" />
    <line x1="0" y1="225" x2="900" y2="225" />
    <line x1="0" y1="315" x2="900" y2="315" />
    <line x1="0" y1="405" x2="900" y2="405" />
  </g>

  <!-- Outer Frame -->
  <rect x="14" y="14" width="872" height="422" rx="8" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" filter="url(#spCyanGlow)" />

  <!-- Corner Brackets -->
  <path d="M 14 34 L 14 14 L 34 14" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 886 34 L 886 14 L 866 14" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 14 416 L 14 436 L 34 436" fill="none" stroke="#BC13FE" stroke-width="2.5" />
  <path d="M 886 416 L 886 436 L 866 436" fill="none" stroke="#BC13FE" stroke-width="2.5" />

  <!-- Floating ambient light node -->
  <circle cx="220" cy="170" r="140" fill="#00F2FF" opacity="0.03" filter="url(#spCyanGlow)">
    <animate attributeName="r" values="140;160;140" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- 2. LEFT SIDE DASHBOARD PANELS -->

  <!-- Widget 1: Render Engine (144 FPS) -->
  <g transform="translate(45, 50)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="url(#glassPanel)" stroke="#122448" stroke-width="1" />
    <text x="16" y="24" font-family="'Courier New', monospace" font-size="9" fill="#00F2FF" letter-spacing="1.5">RENDER ENGINE</text>
    <text x="16" y="54" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">144 <tspan font-size="12" fill="#00F2FF">FPS</tspan></text>
    <text x="16" y="74" font-family="'Courier New', monospace" font-size="8.5" fill="#00FF88">PEAK PERFORMANCE</text>

    <!-- Animated Audio Equalizer Bars -->
    <g transform="translate(16, 86)" fill="#00F2FF">
      <rect x="0" y="0" width="4.5" height="18" rx="1">
        <animate attributeName="height" values="8;22;6;20;8" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="10;0;12;0;10" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="8" y="0" width="4.5" height="18" rx="1">
        <animate attributeName="height" values="20;6;24;10;20" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="0;12;0;8;0" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="16" y="0" width="4.5" height="18" rx="1">
        <animate attributeName="height" values="10;24;8;20;10" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="8;0;10;0;8" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="24" y="0" width="4.5" height="18" rx="1">
        <animate attributeName="height" values="24;10;18;6;24" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="0;8;0;12;0" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="32" y="0" width="4.5" height="18" rx="1">
        <animate attributeName="height" values="14;26;10;20;14" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="4;0;8;0;4" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="40" y="0" width="4.5" height="18" rx="1">
        <animate attributeName="height" values="18;8;22;10;18" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="0;10;0;8;0" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Widget 2: Latency (3.2 MS) -->
  <g transform="translate(175, 180)">
    <rect x="0" y="0" width="150" height="95" rx="8" fill="url(#glassPanel)" stroke="#122448" stroke-width="1" />
    <text x="16" y="20" font-family="'Courier New', monospace" font-size="8.5" fill="#8FA0C5">LATENCY</text>
    <text x="16" y="46" font-family="'Orbitron', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3.2 <tspan font-size="10" fill="#BC13FE">MS AVG</tspan></text>

    <!-- Animated Line Graph with Pulsing Point -->
    <path d="M 16 74 Q 40 54 65 68 T 110 56 T 135 65" fill="none" stroke="#00F2FF" stroke-width="2" filter="url(#spCyanGlow)" />
    <circle cx="110" cy="56" r="4" fill="#00FF88" filter="url(#spCyanGlow)">
      <animate attributeName="cy" values="56;50;58;52;56" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Widget 3: Layer Composition (8 Active Layers) -->
  <g transform="translate(45, 290)">
    <rect x="0" y="0" width="220" height="100" rx="8" fill="url(#glassPanel)" stroke="#122448" stroke-width="1" />
    <text x="16" y="20" font-family="'Courier New', monospace" font-size="8.5" fill="#8FA0C5">LAYER COMPOSITION</text>

    <!-- 10 Node Grid Dots -->
    <g transform="translate(16, 34)" fill="#00F2FF">
      <circle cx="0" cy="0" r="3" opacity="0.9" />
      <circle cx="14" cy="0" r="3" opacity="0.9" />
      <circle cx="28" cy="0" r="3" opacity="0.9" />
      <circle cx="42" cy="0" r="3" opacity="0.9" />
      <circle cx="56" cy="0" r="3" opacity="0.9" />
      <circle cx="70" cy="0" r="3" opacity="0.4" />

      <circle cx="0" cy="12" r="3" opacity="0.9" />
      <circle cx="14" cy="12" r="3" opacity="0.9" />
      <circle cx="28" cy="12" r="3" opacity="0.9" />
      <circle cx="42" cy="12" r="3" opacity="0.4" />
    </g>

    <text x="16" y="66" font-family="'Orbitron', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">8 Active Layers</text>
    <text x="16" y="84" font-family="'Courier New', monospace" font-size="8" fill="#8FA0C5">DEPTH COMPOSITED</text>
  </g>

  <!-- Connector Line -->
  <path d="M 310 225 L 440 225" stroke="#00F2FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="1s" repeatCount="indefinite" />
  </path>
  <circle cx="440" cy="225" r="3.5" fill="#00F2FF" filter="url(#spCyanGlow)" />

  <!-- 3. RIGHT MAIN PANEL: SPACE PORTFOLIO -->
  <g transform="translate(440, 50)">
    <!-- Main Glass Card Container (width 415) -->
    <rect x="0" y="0" width="415" height="340" rx="10" fill="url(#glassPanel)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#spCyanGlow)" />

    <!-- Status Pill Badge Top Right -->
    <g transform="translate(215, 20)">
      <rect x="0" y="0" width="185" height="26" rx="13" fill="#091b38" stroke="#BC13FE" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#BC13FE" filter="url(#spPurpleGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="17" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#BC13FE" letter-spacing="0.5">PRODUCTION READY</text>
    </g>

    <!-- Main Title -->
    <text x="28" y="66" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      SPACE PORTFOLIO
    </text>
    <text x="28" y="92" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#00F2FF" letter-spacing="1.5">
      CINEMATIC UI SYSTEM
    </text>

    <!-- Description -->
    <text x="28" y="125" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8FA0C5">
      Immersive interface system for futuristic
    </text>
    <text x="28" y="143" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8FA0C5">
      interactions and spatial computing.
    </text>

    <!-- Feature Bullets -->
    <g transform="translate(28, 175)">
      <circle cx="4" cy="4" r="3.5" fill="#00F2FF" />
      <text x="18" y="8" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#CBE0FF">VisionOS-inspired glass panels &amp; depth blur</text>

      <circle cx="4" cy="30" r="3.5" fill="#00F2FF" />
      <text x="18" y="34" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#CBE0FF">Neural ambient lighting with dynamic glow</text>

      <polygon points="4,52 8,58 0,58" fill="#00FF88" />
      <text x="18" y="57" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#CBE0FF">60fps cinematic transition system</text>
    </g>

    <!-- Action Button: EXPLORE -->
    <g transform="translate(28, 268)">
      <rect x="0" y="0" width="105" height="34" rx="17" fill="url(#btnGrad)" />
      <text x="52.5" y="21" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" fill="#050a18" text-anchor="middle" letter-spacing="1">EXPLORE</text>
    </g>

    <!-- Meta Badges -->
    <text x="155" y="290" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#00F2FF" letter-spacing="1">★ 1.2K STARS</text>
    <text x="280" y="290" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#BC13FE" letter-spacing="1">TYPESCRIPT</text>
  </g>

  <!-- Footer Info -->
  <text x="45" y="420" font-family="'Courier New', monospace" font-size="8.5" fill="#40557d" letter-spacing="1">SYS V3.0 - 2026 // NEURAL INTERFACE LAB</text>
  <text x="855" y="420" font-family="'Courier New', monospace" font-size="8.5" fill="#00F2FF" text-anchor="end" letter-spacing="1">GUI // V3.0-2026</text>
</svg>
