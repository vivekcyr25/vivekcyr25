<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img" aria-label="GitHub Contribution Streak Statistics for vivekcyr25">
  <title>GitHub Contribution Streak Statistics for vivekcyr25</title>
  <desc>Shows total contributions, current streak, and longest streak on GitHub.</desc>
  <defs>
    <!-- Background Deep Space Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#070F22"/>
    </linearGradient>
    <!-- Calming Border Shimmer Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Divider Gradient -->
    <linearGradient id="divGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#00F5D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <!-- Celestial Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5964"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <!-- Streak Rings Gradients -->
    <linearGradient id="tealRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="orbitRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <!-- Radial Ambient Center Light -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050B18" stop-opacity="0"/>
    </radialGradient>
    <!-- Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="flameGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Base Card ── -->
  <rect width="495" height="195" rx="12" fill="url(#cardBg)"/>
  <!-- Ambient Aura -->
  <circle cx="247.5" cy="71" r="75" fill="url(#centerGlow)"/>
  <!-- Shimmer Border -->
  <rect x="0.75" y="0.75" width="493.5" height="193.5" rx="11.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.6;0.95;0.6" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Subdued Accent Line -->
  <rect x="20" y="1" width="455" height="2" rx="1" fill="url(#borderGrad)" opacity="0.75">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Panel Dividers ── -->
  <line x1="165" y1="24" x2="165" y2="162" stroke="url(#divGrad)" stroke-width="1"/>
  <line x1="330" y1="24" x2="330" y2="162" stroke="url(#divGrad)" stroke-width="1"/>

  <!-- ════ LEFT: Total Contributions ════ -->
  <text x="82.5" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" text-anchor="middle" filter="url(#softGlow)" font-variant-numeric="tabular-nums">1,069</text>
  <text x="82.5" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#00F5D4" text-anchor="middle" letter-spacing="0.3">Total Contributions</text>
  <text x="82.5" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Aug 20, 2025 – Present</text>

  <!-- ════ CENTER: Current Streak ════ -->
  <!-- Calming Breathing Flame -->
  <g transform="translate(247.5, 18)">
    <path d="M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z" fill="url(#flameGrad)" filter="url(#flameGlow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Main Pulse Ring -->
  <circle cx="247.5" cy="71" r="38" fill="none" stroke="url(#tealRing)" stroke-width="3.5" filter="url(#softGlow)">
    <animate attributeName="stroke-opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Orbital Dashed Accents (Gentle 24s Celestial Rotation) -->
  <circle cx="247.5" cy="71" r="42" fill="none" stroke="url(#orbitRing)" stroke-width="1.6" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate" from="0 247.5 71" to="360 247.5 71" dur="24s" repeatCount="indefinite"/>
  </circle>
  <text x="247.5" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" filter="url(#softGlow)">2</text>
  <text x="247.5" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#A78BFA" text-anchor="middle" letter-spacing="0.3">Current Streak</text>
  <text x="247.5" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Aug 14 – Aug 15</text>

  <!-- ════ RIGHT: Longest Streak ════ -->
  <text x="412.5" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#FFFBEB" text-anchor="middle" filter="url(#softGlow)" font-variant-numeric="tabular-nums">19</text>
  <text x="412.5" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#FBBF24" text-anchor="middle" letter-spacing="0.3">Longest Streak</text>
  <text x="412.5" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#94A3B8" text-anchor="middle">Jul 21 – Aug 8</text>

  <!-- ── Footer Micro Readout ── -->
  <circle cx="165" cy="180" r="2.5" fill="#00F5D4" opacity="0.8">
    <animate attributeName="r" values="2;3.2;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="247.5" y="183" font-family="Segoe UI,Arial,sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5" opacity="0.8">CELESTIAL STREAK HUD · vivekcyr25</text>
</svg>