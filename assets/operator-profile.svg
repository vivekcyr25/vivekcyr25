<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%">
  <defs>
    <linearGradient id="opBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040a16"/>
      <stop offset="50%" stop-color="#060c20"/>
      <stop offset="100%" stop-color="#0a0620"/>
    </linearGradient>

    <linearGradient id="opGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09142b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#050a18" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="opBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FF"/>
      <stop offset="100%" stop-color="#BC13FE"/>
    </linearGradient>

    <linearGradient id="opMission" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#BC13FE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="opBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FF"/>
      <stop offset="55%" stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#BC13FE"/>
    </linearGradient>

    <linearGradient id="opScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F2FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F2FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="opGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="opSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="opPanelClip">
      <rect x="20" y="20" width="860" height="420" rx="14"/>
    </clipPath>
  </defs>

  <rect width="900" height="460" fill="url(#opBg)" rx="16"/>
  <rect x="20" y="20" width="860" height="420" rx="14" fill="url(#opGlass)" stroke="url(#opBorder)" stroke-width="1.5" filter="url(#opGlow)"/>

  <g clip-path="url(#opPanelClip)" opacity="0.12" stroke="#00F2FF" stroke-width="0.5">
    <line x1="20" y1="90" x2="880" y2="90"/>
    <line x1="20" y1="160" x2="880" y2="160"/>
