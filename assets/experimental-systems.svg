<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="expBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040a16" />
      <stop offset="50%" stop-color="#060f22" />
      <stop offset="100%" stop-color="#0b0826" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="expCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="expPurpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glass Panel Fill -->
    <linearGradient id="expGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#040918" stop-opacity="0.95" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="expBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FF" stroke-opacity="0.8" />
      <stop offset="60%" stop-color="#5533FF" stroke-opacity="0.4" />
      <stop offset="100%" stop-color="#BC13FE" stroke-opacity="0.8" />
    </linearGradient>

    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#00FF88" />
    </linearGradient>

    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#BC13FE" />
    </linearGradient>
  </defs>

  <!-- 1. BACKGROUND -->
  <rect width="900" height="450" fill="url(#expBg)" rx="10" />

  <!-- Subtle Tech Grid -->
  <g stroke="#00F2FF" stroke-width="0.5" opacity="0.07">
    <line x1="45" y1="0" x2="45" y2="450" />
    <line x1="135" y1="0" x2="135" y2="450" />
    <line x1="225" y1="0" x2="225" y2="450" />
    <line x1="315" y1="0" x2="315" y2="450" />
    <line x1="405" y1="0" x2="405" y2="450" />
    <line x1="495" y1="0" x2="495" y2="450" />
    <line x1="585" y1="0" x2="585" y2="450" />
    <line x1="675" y1="0" x2="675" y2="450" />
    <line x1="765" y1="0" x2="765" y2="450" />
    <line x1="855" y1="0" x2="855" y2="450" />
    <line x1="0" y1="45" x2="900" y2="45" />
    <line x1="0" y1="135" x2="900" y2="135" />
    <line x1="0" y1="225" x2="900" y2="225" />
    <line x1="0" y1="315" x2="900" y2="315" />
    <line x1="0" y1="405" x2="900" y2="405" />
  </g>

  <!-- Outer Frame -->
  <rect x="14" y="14" width="872" height="422" rx="8" fill="none" stroke="url(#expBorderGrad)" stroke-width="1.2" filter="url(#expCyanGlow)" />

  <!-- Corner Tech Brackets -->
  <path d="M 14 34 L 14 14 L 34 14" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 886 34 L 886 14 L 866 14" fill="none" stroke="#00F2FF" stroke-width="2.5" />
  <path d="M 14 416 L 14 436 L 34 436" fill="none" stroke="#BC13FE" stroke-width="2.5" />
  <path d="M 886 416 L 886 436 L 866 436" fill="none" stroke="#BC13FE" stroke-width="2.5" />

  <!-- 2. LEFT MAIN PANEL: EXPERIMENTAL SYSTEMS -->
  <g transform="translate(45, 50)">
    <!-- Glass Box -->
    <rect x="0" y="0" width="415" height="340" rx="10" fill="url(#expGlass)" stroke="url(#expBorderGrad)" stroke-width="1.5" filter="url(#expCyanGlow)" />

    <!-- Active Research Badge -->
    <g transform="translate(24, 22)">
      <circle cx="5" cy="5" r="4.5" fill="#00FF88" filter="url(#expCyanGlow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="18" y="9" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#00FF88" letter-spacing="1.5">ACTIVE RESEARCH</text>
    </g>

    <!-- Main Title -->
    <text x="24" y="68" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      EXPERIMENTAL
    </text>
    <text x="24" y="94" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#00F2FF" letter-spacing="1.5">
      SYSTEMS
    </text>

    <!-- Subtitle -->
    <text x="24" y="125" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#8FA0C5">
      VisionOS glassmorphism &amp; futuristic
    </text>
    <text x="24" y="143" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#8FA0C5">
      frontend R&amp;D laboratory
    </text>

    <!-- Stat Metric Boxes -->
    <g transform="translate(24, 172)">
      <rect x="0" y="0" width="105" height="65" rx="6" fill="#061126" stroke="#122548" stroke-width="1" />
      <text x="14" y="30" font-family="'Orbitron', sans-serif" font-size="17" font-weight="bold" fill="#00F2FF">v2.4</text>
      <text x="14" y="50" font-family="'Courier New', monospace" font-size="8.5" fill="#8FA0C5">BUILD</text>
    </g>

    <g transform="translate(144, 172)">
      <rect x="0" y="0" width="105" height="65" rx="6" fill="#061126" stroke="#122548" stroke-width="1" />
      <text x="14" y="30" font-family="'Orbitron', sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">247</text>
      <text x="14" y="50" font-family="'Courier New', monospace" font-size="8.5" fill="#8FA0C5">STARS</text>
    </g>

    <g transform="translate(264, 172)">
      <rect x="0" y="0" width="125" height="65" rx="6" fill="#061126" stroke="#122548" stroke-width="1" />
      <text x="14" y="30" font-family="'Orbitron', sans-serif" font-size="17" font-weight="bold" fill="#00FF88">98%</text>
      <text x="14" y="50" font-family="'Courier New', monospace" font-size="8.5" fill="#8FA0C5">UPTIME</text>
    </g>

    <!-- Tags Row -->
    <g transform="translate(24, 270)">
      <rect x="0" y="0" width="95" height="26" rx="13" fill="#091833" stroke="#00F2FF" stroke-width="1" />
      <text x="47.5" y="17" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#00F2FF" text-anchor="middle">VISIONOS</text>

      <rect x="110" y="0" width="95" height="26" rx="13" fill="#091833" stroke="#BC13FE" stroke-width="1" />
      <text x="157.5" y="17" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#BC13FE" text-anchor="middle">NEURAL UI</text>

      <rect x="220" y="0" width="65" height="26" rx="13" fill="#091833" stroke="#00FF88" stroke-width="1" />
      <text x="252.5" y="17" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#00FF88" text-anchor="middle">R&amp;D</text>
    </g>
  </g>

  <!-- Connecting line -->
  <path d="M 460 220 L 495 220" stroke="#00F2FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-12" dur="1s" repeatCount="indefinite" />
  </path>
  <circle cx="495" cy="220" r="3.5" fill="#00F2FF" filter="url(#expCyanGlow)" />

  <!-- 3. RIGHT SIDE PANELS -->
  <!-- Top Right Open Source Badge -->
  <g transform="translate(715, 50)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#091833" stroke="#00F2FF" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#00F2FF" />
    <text x="28" y="17" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#00F2FF" letter-spacing="1">OPEN SOURCE</text>
  </g>

  <!-- Widget 1: SYSTEM MATRIX -->
  <g transform="translate(495, 95)">
    <rect x="0" y="0" width="360" height="125" rx="8" fill="url(#expGlass)" stroke="#122548" stroke-width="1" />
    <text x="16" y="22" font-family="'Courier New', monospace" font-size="9" fill="#00F2FF" letter-spacing="1.5">SYSTEM MATRIX</text>

    <!-- Bar 1 -->
    <text x="16" y="46" font-family="'Courier New', monospace" font-size="8" fill="#8FA0C5">Neural Layer Alpha</text>
    <rect x="16" y="50" width="250" height="4.5" rx="2" fill="#081226" />
    <rect x="16" y="50" width="200" height="4.5" rx="2" fill="url(#barCyan)">
      <animate attributeName="width" values="160;210;185;200" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Bar 2 -->
    <text x="16" y="72" font-family="'Courier New', monospace" font-size="8" fill="#8FA0C5">Glass Render Engine</text>
    <rect x="16" y="76" width="250" height="4.5" rx="2" fill="#081226" />
    <rect x="16" y="76" width="225" height="4.5" rx="2" fill="url(#barCyan)">
      <animate attributeName="width" values="180;240;210;225" dur="2.5s" repeatCount="indefinite" />
    </rect>

    <!-- Bar 3 -->
    <text x="16" y="98" font-family="'Courier New', monospace" font-size="8" fill="#8FA0C5">Spatial Depth Map</text>
    <rect x="16" y="102" width="250" height="4.5" rx="2" fill="#081226" />
    <rect x="16" y="102" width="165" height="4.5" rx="2" fill="url(#barPurple)">
      <animate attributeName="width" values="130;180;150;165" dur="3.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Widget 2: INTERFACE & CONNECTIONS -->
  <g transform="translate(495, 235)">
    <rect x="0" y="0" width="165" height="155" rx="8" fill="url(#expGlass)" stroke="#122548" stroke-width="1" />
    <text x="14" y="20" font-family="'Courier New', monospace" font-size="8.5" fill="#8FA0C5">INTERFACE</text>

    <!-- Network Node Graphic -->
    <g transform="translate(42, 50)">
      <circle cx="40" cy="20" r="20" fill="none" stroke="#00F2FF" stroke-width="1.2" stroke-dasharray="3,3">
        <animateTransform attributeName="transform" type="rotate" from="0 40 20" to="360 40 20" dur="8s" repeatCount="indefinite" />
      </circle>
      <circle cx="40" cy="20" r="7" fill="#00FF88" filter="url(#expCyanGlow)">
        <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <text x="14" y="110" font-family="'Courier New', monospace" font-size="8" fill="#00FF88" font-weight="bold">ACTIVE NODE</text>
    <text x="14" y="128" font-family="'Orbitron', sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">12/16</text>
    <text x="14" y="142" font-family="'Courier New', monospace" font-size="7.5" fill="#8FA0C5">CONNECTIONS</text>
  </g>

  <!-- Widget 3: FREQ ANALYSIS -->
  <g transform="translate(675, 235)">
    <rect x="0" y="0" width="180" height="155" rx="8" fill="url(#expGlass)" stroke="#122548" stroke-width="1" />
    <text x="16" y="20" font-family="'Courier New', monospace" font-size="8.5" fill="#8FA0C5">FREQ ANALYSIS</text>

    <!-- Animated Equalizer Bars Grid -->
    <g transform="translate(20, 50)" fill="#00F2FF">
      <rect x="0" y="0" width="7" height="40" rx="2">
        <animate attributeName="height" values="18;48;12;40" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="30;0;36;8" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="14" y="0" width="7" height="40" rx="2">
        <animate attributeName="height" values="40;15;50;22" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="8;33;0;26" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="28" y="0" width="7" height="40" rx="2">
        <animate attributeName="height" values="22;50;18;42" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="26;0;30;6" dur="0.9s" repeatCount="indefinite" />
      </rect>
      <rect x="42" y="0" width="7" height="40" rx="2">
        <animate attributeName="height" values="48;20;40;15" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="0;28;8;33" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="56" y="0" width="7" height="40" rx="2">
        <animate attributeName="height" values="15;42;25;50" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="33;6;23;0" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="70" y="0" width="7" height="40" rx="2">
        <animate attributeName="height" values="35;12;45;28" dur="1.0s" repeatCount="indefinite" />
        <animate attributeName="y" values="13;36;3;20" dur="1.0s" repeatCount="indefinite" />
      </rect>
      <rect x="84" y="0" width="7" height="40" rx="2">
        <animate attributeName="height" values="50;28;15;42" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="0;20;33;6" dur="1.5s" repeatCount="indefinite" />
      </rect>
    </g>

    <text x="16" y="130" font-family="'Courier New', monospace" font-size="8" fill="#BC13FE" font-weight="bold">SIGNAL DEPTH</text>
  </g>

  <!-- Footer -->
  <text x="45" y="420" font-family="'Courier New', monospace" font-size="8.5" fill="#40557d" letter-spacing="1">SYS 2026 // NEURAL INTERFACE LAB</text>
</svg>
