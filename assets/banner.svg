    <line x1="158" y1="58"  x2="138" y2="98"/>
    <line x1="128" y1="28"  x2="98"  y2="78"/>
    <line x1="128" y1="28"  x2="78"  y2="38"/>
    <line x1="128" y1="28"  x2="180" y2="30"/>
    <line x1="98"  y1="78"  x2="78"  y2="38"/>
    <line x1="98"  y1="78"  x2="48"  y2="92"/>
    <line x1="98"  y1="78"  x2="108" y2="128"/>
    <line x1="78"  y1="38"  x2="48"  y2="92"/>
