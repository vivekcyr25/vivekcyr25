<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%">
<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#040a16"/>
    <stop offset="45%"  stop-color="#050c1e"/>
    <stop offset="75%"  stop-color="#090620"/>
    <stop offset="100%" stop-color="#0d0828"/>
  </linearGradient>

  <!-- Cyan cluster glow -->
  <filter id="cGlow" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Purple cluster glow -->
  <filter id="pGlow" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Bar glow -->
  <filter id="barGlow" x="-2%" y="-80%" width="104%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

</defs>

<!-- ═══ BACKGROUND ═══ -->
<rect width="900" height="300" fill="url(#bg)"/>

<!-- ═══ GRID ═══ -->
<g stroke="#00F2FF" stroke-width="0.5" opacity="0.13">
  <!-- Vertical lines -->
  <line x1="40"  y1="0" x2="40"  y2="300"/>
  <line x1="80"  y1="0" x2="80"  y2="300"/>
  <line x1="120" y1="0" x2="120" y2="300"/>
  <line x1="160" y1="0" x2="160" y2="300"/>
  <line x1="200" y1="0" x2="200" y2="300"/>
  <line x1="240" y1="0" x2="240" y2="300"/>
  <line x1="280" y1="0" x2="280" y2="300"/>
  <line x1="320" y1="0" x2="320" y2="300"/>
  <line x1="360" y1="0" x2="360" y2="300"/>
  <line x1="400" y1="0" x2="400" y2="300"/>
  <line x1="440" y1="0" x2="440" y2="300"/>
  <line x1="480" y1="0" x2="480" y2="300"/>
  <line x1="520" y1="0" x2="520" y2="300"/>
  <line x1="560" y1="0" x2="560" y2="300"/>
  <line x1="600" y1="0" x2="600" y2="300"/>
  <line x1="640" y1="0" x2="640" y2="300"/>
  <line x1="680" y1="0" x2="680" y2="300"/>
  <line x1="720" y1="0" x2="720" y2="300"/>
  <line x1="760" y1="0" x2="760" y2="300"/>
  <line x1="800" y1="0" x2="800" y2="300"/>
  <line x1="840" y1="0" x2="840" y2="300"/>
  <line x1="880" y1="0" x2="880" y2="300"/>
  <!-- Horizontal lines -->
  <line x1="0" y1="40"  x2="900" y2="40"/>
  <line x1="0" y1="80"  x2="900" y2="80"/>
  <line x1="0" y1="120" x2="900" y2="120"/>
  <line x1="0" y1="160" x2="900" y2="160"/>
  <line x1="0" y1="200" x2="900" y2="200"/>
  <line x1="0" y1="240" x2="900" y2="240"/>
  <line x1="0" y1="280" x2="900" y2="280"/>
</g>

<!-- ═══ LEFT WIREFRAME CLUSTER — CYAN, MIRRORED FROM RIGHT PATTERN ═══ -->
<g filter="url(#cGlow)">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 5,-4; 0,0; -5,4; 0,0"
    keyTimes="0;0.25;0.5;0.75;1"
    dur="12s" repeatCount="indefinite"
    calcMode="spline"
    keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"/>

  <!-- Corner brackets framing the cluster -->
  <g stroke="#00F2FF" stroke-width="1.2" fill="none" opacity="0.55">
    <polyline points="270,18 270,38 250,38"/>
    <polyline points="12,198 12,178 32,178"/>
  </g>

