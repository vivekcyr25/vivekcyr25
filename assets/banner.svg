    <line x1="248" y1="188" x2="348" y2="218" opacity="0.25"/>
    <line x1="10"  y1="90"  x2="0"   y2="82"  opacity="0.4"/>
  </g>

  <!-- Nodes — varied sizes for key vertices -->
  <g fill="#00F2FF">
    <circle cx="18"  cy="248" r="3"/>
    <circle cx="38"  cy="128" r="2"/>
