<!-- ═══ CENTER TEXT ═══ -->

<!-- AI SYSTEMS DEVELOPER -->
<text x="450" y="118"
      text-anchor="middle"
      font-family="'Courier New',Courier,monospace"
      font-size="9" fill="#00F2FF"
      letter-spacing="4.5" opacity="0.82">AI SYSTEMS DEVELOPER</text>

<!-- VIVEK SHARMA -->
<text x="450" y="160"
      text-anchor="middle"
      font-family="'Arial Black','Arial',sans-serif"
      font-size="42" font-weight="900"
      fill="#ffffff">VIVEK SHARMA</text>

<!-- BUILDING CINEMATIC INTELLIGENT INTERFACES -->
<text x="450" y="182"
      text-anchor="middle"
      font-family="'Courier New',Courier,monospace"
      font-size="8" fill="#8899cc"
      letter-spacing="4">BUILDING CINEMATIC INTELLIGENT INTERFACES</text>

<!-- ═══ CYAN BAR ═══ -->
<!-- Glow layer -->
<rect x="127" y="226" width="652" height="10" rx="1" fill="#00F2FF"
      filter="url(#barGlow)">
  <animate attributeName="opacity" values="0.55;0.28;0.55" dur="3.5s" repeatCount="indefinite"/>
</rect>
<!-- Solid bar -->
<rect x="127" y="226" width="652" height="10" rx="1" fill="#00F2FF">
  <animate attributeName="opacity" values="1;0.82;1" dur="3.5s" repeatCount="indefinite"/>
</rect>

</svg>
