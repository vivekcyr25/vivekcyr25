    <line x1="240" y1="42"  x2="348" y2="38"  opacity="0.25"/>
    <line x1="18"  y1="58"  x2="0"   y2="48"  opacity="0.4"/>
  </g>

  <!-- Nodes — mirrored sizes from right cluster -->
  <g fill="#00F2FF">
    <circle cx="240" cy="42"  r="3">
      <animate attributeName="opacity" values="1;0.45;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="202" cy="22"  r="2"/>
    <circle cx="158" cy="58"  r="2"/>
    <circle cx="128" cy="28"  r="3">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="98"  cy="78"  r="2"/>
    <circle cx="78"  cy="38"  r="2"/>
    <circle cx="48"  cy="92"  r="2"/>
    <circle cx="28"  cy="152" r="3">
      <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58"  cy="182" r="2"/>
    <circle cx="98"  cy="158" r="2"/>
    <circle cx="148" cy="188" r="2"/>
    <circle cx="108" cy="128" r="2"/>
    <circle cx="138" cy="98"  r="2.5">
      <animate attributeName="r" values="2.5;3.2;2.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="202" cy="112" r="2"/>
    <circle cx="232" cy="82"  r="2"/>
