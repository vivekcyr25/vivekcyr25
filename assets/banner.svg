    <line x1="872" y1="152" x2="842" y2="182"/>
    <line x1="872" y1="152" x2="802" y2="158"/>
    <line x1="872" y1="152" x2="882" y2="58"/>
    <line x1="842" y1="182" x2="802" y2="158"/>
    <line x1="842" y1="182" x2="752" y2="188"/>
    <line x1="842" y1="182" x2="792" y2="128"/>
    <line x1="802" y1="158" x2="752" y2="188"/>
    <line x1="802" y1="158" x2="792" y2="128"/>
