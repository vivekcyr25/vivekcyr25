name: Accessibility Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'assets/*.svg'
      - 'scripts/inspect_accessibility.py'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  accessibility-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit SVG Accessibility
        run: |
          python scripts/inspect_accessibility.py
