name: 🐍 Contribution Snake Animation

on:
  schedule:
    # Regenerates daily at 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate:
    name: Generate Snake SVG
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vivekcyr25
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push snake SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake*.svg
          git diff --staged --quiet || git commit -m "chore: update snake animation [skip ci]"
          git push
