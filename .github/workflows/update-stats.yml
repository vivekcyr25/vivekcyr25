name: 📊 Real-Time Stats Dashboard

on:
  # Run every day at 00:30 UTC (6 AM IST)
  schedule:
    - cron: "30 0 * * *"

  # Run on every push to main
  push:
    branches: [main, master]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  group: stats-dashboard
  cancel-in-progress: true

jobs:
  update-stats:
    name: Generate Live Stats SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📊 Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: 💾 Commit & push updated SVG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dashboard.svg
          git diff --staged --quiet || git commit -m "chore: sync stats dashboard [skip ci]"
          git push
