[metadata]
name = vivekcyr25-profile
version = 2.1.0
author = Vivek Sharma
description = GitHub Profile README with VisionOS-inspired animated SVG dashboards
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Development Status :: 5 - Production/Stable
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Topic :: Multimedia :: Graphics

[options]
python_requires = >=3.10
packages = scripts

[options.entry_points]
console_scripts =
    gen-stats = scripts.generate_stats:main
    gen-separator = scripts.generate_separator:main
    gen-connectivity = scripts.build_connectivity:main
    gen-badge = scripts.generate_badge:main
    validate-svgs = scripts.validate_svgs:main

[tool:pytest]
testpaths = tests

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist